name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Behavior tests
        run: python -B -m unittest discover -s tests -v
      - name: Manifests and distributable hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd()
          portable = json.loads((root / "plugin.json").read_text())
          legacy = json.loads((root / ".codex-plugin/plugin.json").read_text())
          market = json.loads((root / ".agents/plugins/marketplace.json").read_text())
          assert portable["name"] == legacy["name"] == market["plugins"][0]["name"]
          assert portable["version"] == legacy["version"]
          assert portable["extensions"]["com.openai"]["interface"] == legacy["interface"]
          assert (root / legacy["skills"]).is_dir()
          package = json.loads((root / "PACKAGE-CONTENTS.json").read_text())
          for entry in package["files"]:
              path = (root / entry["path"]).resolve()
              assert path.is_relative_to(root) and path.is_file(), entry["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], entry["path"]
          print("Package metadata and hashes verified.")
          PY
